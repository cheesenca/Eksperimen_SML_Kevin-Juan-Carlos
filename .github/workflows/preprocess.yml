name: Automated Preprocessing Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  preprocess:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run preprocessing script
      working-directory: preprocessing
      run: |
        ls -la
        python automate_Kevin-Juan-Carlos.py

    - name: Commit and push processed data
      uses: EndBug/add-and-commit@v9
      with:
        add: 'preprocessing/bank_transactions_processed/bank_transactions_processed.csv'
        author_name: 'github-actions[bot]'
        author_email: 'github-actions[bot]@users.noreply.github.com'
        message: 'Update pre-processed data'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
